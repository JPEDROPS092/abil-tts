<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abil TTS</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='abil.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='abil.png') }}" />
  <style>
    /* ── Catppuccin Mocha ─────────────────────────────────────────────── */
    :root {
      --bg:      #1e1e2e;
      --mantle:  #181825;
      --crust:   #11111b;
      --surface: #313244;
      --overlay: #45475a;
      --text:    #cdd6f4;
      --sub:     #a6adc8;
      --muted:   #6c7086;
      --blue:    #89b4fa;
      --sky:     #89dceb;
      --green:   #a6e3a1;
      --red:     #f38ba8;
      --yellow:  #f9e2af;
      --peach:   #fab387;
      --radius:  8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Inter", system-ui, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 54px;
      background: var(--mantle);
      border-bottom: 1px solid var(--overlay);
      flex-shrink: 0;
    }
    .logo { color: var(--blue); font-size: 18px; font-weight: 700; }
    .logo-icon {
      width: 28px; height: 28px;
      object-fit: contain;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .brand-icon {
      width: 72px; height: 72px;
      object-fit: contain;
      border-radius: 12px;
    }
    .model-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--sub);
      margin-left: 8px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background .4s;
    }
    .dot.ready { background: var(--green); }
    .dot.error { background: var(--red); }

    /* ── Main layout ─────────────────────────────────────────────────────── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
      overflow: hidden;
    }

    /* ── Editor panel ────────────────────────────────────────────────────── */
    .editor-panel {
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 10px;
      overflow: hidden;
      border-right: 1px solid var(--overlay);
    }

    .editor-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed var(--overlay);
      border-radius: var(--radius);
      padding: 12px 18px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      text-align: center;
      color: var(--sub);
      font-size: 13px;
      flex-shrink: 0;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--blue);
      background: rgba(137,180,250,.06);
      color: var(--blue);
    }
    #drop-zone span { pointer-events: none; }
    #file-input { display: none; }

    textarea#text-input {
      flex: 1;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--overlay);
      border-radius: var(--radius);
      padding: 14px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 13px;
      resize: none;
      outline: none;
      line-height: 1.6;
      transition: border-color .2s;
    }
    textarea#text-input:focus { border-color: var(--blue); }

    .editor-footer {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Settings panel ──────────────────────────────────────────────────── */
    .settings-panel {
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 14px;
      background: var(--mantle);
      overflow-y: auto;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; color: var(--sub); }

    select, input[type="text"] {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--overlay);
      border-radius: var(--radius);
      padding: 7px 10px;
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: border-color .2s;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    select:focus, input:focus { border-color: var(--blue); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border: none; border-radius: var(--radius);
      padding: 9px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .15s, opacity .15s;
      width: 100%;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary  { background: var(--blue);  color: #1e1e2e; }
    .btn-primary:hover:not(:disabled)  { background: #74c7ec; }
    .btn-default  { background: var(--overlay); color: var(--text); }
    .btn-default:hover:not(:disabled)  { background: #585b70; }
    .btn-danger   { background: var(--red);   color: #1e1e2e; }
    .btn-danger:hover:not(:disabled)   { background: #eba0ac; }

    hr { border: none; border-top: 1px solid var(--overlay); }

    /* Progress */
    #progress-wrap { display: none; flex-direction: column; gap: 6px; }
    #progress-wrap.visible { display: flex; }
    progress {
      width: 100%; height: 6px; border: none;
      border-radius: 3px; background: var(--overlay);
    }
    progress::-webkit-progress-bar   { background: var(--overlay); border-radius: 3px; }
    progress::-webkit-progress-value { background: var(--blue);    border-radius: 3px; }
    progress::-moz-progress-bar      { background: var(--blue);    border-radius: 3px; }
    #progress-msg { font-size: 12px; color: var(--sub); }

    /* Audio player */
    #audio-wrap { display: none; flex-direction: column; gap: 8px; }
    #audio-wrap.visible { display: flex; }
    audio {
      width: 100%; border-radius: var(--radius);
      background: var(--surface);
    }

    /* Diagram */
    #diagram-wrap { display: none; flex-direction: column; gap: 8px; }
    #diagram-wrap.visible { display: flex; }
    #diagram-source {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--overlay);
      border-radius: var(--radius);
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 12px;
      line-height: 1.5;
      min-height: 120px;
      max-height: 220px;
      padding: 10px;
      overflow: auto;
      white-space: pre;
    }
    #diagram-preview {
      background: var(--surface);
      border: 1px solid var(--overlay);
      border-radius: var(--radius);
      padding: 10px;
      overflow: auto;
      max-height: 280px;
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
      background: var(--surface); color: var(--text);
      padding: 10px 20px; border-radius: 20px;
      font-size: 13px; box-shadow: 0 4px 24px rgba(0,0,0,.5);
      opacity: 0; transition: opacity .25s, transform .25s;
      pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: var(--red); color: #1e1e2e; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--mantle); }
    ::-webkit-scrollbar-thumb { background: var(--overlay); border-radius: 3px; }

    /* Checkbox row */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--sub);
      cursor: pointer;
      user-select: none;
    }
    .checkbox-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    /* ── Loading overlay ──────────────────────────────────────────────── */
    #app { display: none; flex-direction: column; height: 100vh; }
    #app.ready { display: flex; }

    #loading-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      z-index: 9999;
      transition: opacity .4s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }

    #loading-screen .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--blue);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .spinner {
      width: 56px; height: 56px;
      border: 4px solid var(--overlay);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-msg {
      color: var(--sub);
      font-size: 14px;
      text-align: center;
      max-width: 460px;
      line-height: 1.5;
    }
    #loading-sub {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .loading-dots::after {
      content: '';
      display: inline-block;
      width: 1em;
      text-align: left;
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
  </style>
</head>
<body>

<!-- ── Loading screen ────────────────────────────────────────────── -->
<div id="loading-screen">
  <div class="brand">
    <img src="{{ url_for('static', filename='abil.png') }}" alt="Abil" class="brand-icon" />
    Abil TTS
  </div>
  <div class="spinner"></div>
  <div id="loading-msg">
    <span id="loading-text">Carregando modelo</span><span class="loading-dots"></span>
  </div>
  <div id="loading-sub">
    Isso pode levar alguns minutos no primeiro uso enquanto o modelo é baixado.
  </div>
</div>

<div id="app">

<header>
  <img src="{{ url_for('static', filename='abil.png') }}" alt="Abil" class="logo-icon" />
  <span class="logo">Abil TTS</span>
  <div class="model-badge">
    <div class="dot" id="model-dot"></div>
    <span id="model-status">Model ready</span>
  </div>
</header>

<main>
  <!-- ── Editor ──────────────────────────────────────────────────── -->
  <section class="editor-panel">
    <div class="editor-toolbar">
      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <span>📂 Drop a file here or <u>click to open</u> — .txt · .md · .docx · .pdf</span>
      </div>
      <input type="file" id="file-input"
             accept=".txt,.md,.markdown,.docx,.pdf" />
    </div>

    <textarea id="text-input"
              placeholder="Type or paste your text here, or open a document above…"
              spellcheck="false"></textarea>

    <div class="editor-footer">
      <span id="char-count">0 characters · 0 words</span>
      <span>Ctrl+A to select all</span>
    </div>
  </section>

  <!-- ── Settings ─────────────────────────────────────────────────── -->
  <aside class="settings-panel">
    <div class="panel-title">Voice Settings</div>

    <div class="field">
      <label for="backend-select">Backend</label>
      <select id="backend-select">
        {% for b in backends %}
        <option value="{{ b.id }}" {% if b.id == default_backend %}selected{% endif %}>{{ b.label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label for="device-select">Device</label>
      <select id="device-select">
        <option value="cuda:0" {% if default_device == "cuda:0" %}selected{% endif %}>cuda:0</option>
        <option value="cuda:1" {% if default_device == "cuda:1" %}selected{% endif %}>cuda:1</option>
        <option value="cpu" {% if default_device == "cpu" %}selected{% endif %}>cpu</option>
      </select>
    </div>

    <div class="field">
      <label for="speaker-select">Speaker</label>
      <select id="speaker-select">
        {% for s in speakers %}
        <option value="{{ s }}" {% if s == "Ryan" %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label for="lang-select">Language</label>
      <select id="lang-select">
        {% for l in languages %}
        <option value="{{ l }}" {% if l == "English" %}selected{% endif %}>{{ l }}</option>
        {% endfor %}
      </select>
    </div>

    <hr />

    <button class="btn btn-primary" id="gen-btn" disabled>
      ▶&nbsp; Generate Audio
    </button>

    <!-- Progress -->
    <div id="progress-wrap">
      <progress id="progress-bar" value="0" max="100"></progress>
      <span id="progress-msg">Starting…</span>
    </div>

    <!-- Audio player -->
    <div id="audio-wrap">
      <div class="panel-title">Output</div>
      <audio id="audio-player" controls></audio>
      <button class="btn btn-default" id="download-btn">⬇&nbsp; Download WAV</button>
    </div>

    <hr />

    <div class="panel-title">Diagram (Mermaid)</div>
    <div class="field">
      <label for="diagram-title">Diagram title</label>
      <input id="diagram-title" type="text" value="Text Flow" />
    </div>
    <div class="field">
      <label for="diagram-scope">Text scope</label>
      <select id="diagram-scope">
        <option value="auto" selected>Auto (selection if any)</option>
        <option value="selection">Only selected text</option>
        <option value="full">Whole text</option>
      </select>
    </div>
    <button class="btn btn-default" id="diagram-btn">🧭&nbsp; Generate Diagram</button>

    <div id="diagram-wrap">
      <div id="diagram-source"></div>
      <div id="diagram-preview"></div>
      <button class="btn btn-default" id="diagram-download-btn">⬇&nbsp; Download .mmd</button>
    </div>

    <hr />

    <div class="panel-title">Quick Actions</div>
    <label class="checkbox-row" title="Re-flow paragraphs and expand numbers / dates / abbreviations for the selected language before TTS.">
      <input type="checkbox" id="normalize-toggle" checked />
      <span>Normalize text for TTS</span>
    </label>
    <button class="btn btn-default" id="preview-btn">🔍&nbsp; Preview normalized text</button>
    <button class="btn btn-default" id="paste-btn">📋&nbsp; Paste Clipboard</button>
    <button class="btn btn-danger"  id="clear-btn">🗑&nbsp; Clear Text</button>
  </aside>
</main>

</div><!-- /#app -->

<!-- Toast notification -->
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  let currentTaskId = null;
  let pollTimer = null;
  let currentAudioUrl = null;
  let currentMermaid = '';

  // ── Elements ─────────────────────────────────────────────────────────────
  const textInput    = document.getElementById('text-input');
  const charCount    = document.getElementById('char-count');
  const dropZone     = document.getElementById('drop-zone');
  const fileInput    = document.getElementById('file-input');
  const backendSelect = document.getElementById('backend-select');
  const deviceSelect  = document.getElementById('device-select');
  const speakerSelect = document.getElementById('speaker-select');
  const langSelect = document.getElementById('lang-select');
  const genBtn       = document.getElementById('gen-btn');
  const progressWrap = document.getElementById('progress-wrap');
  const progressBar  = document.getElementById('progress-bar');
  const progressMsg  = document.getElementById('progress-msg');
  const audioWrap    = document.getElementById('audio-wrap');
  const audioPlayer  = document.getElementById('audio-player');
  const downloadBtn  = document.getElementById('download-btn');
  const modelDot     = document.getElementById('model-dot');
  const modelStatus  = document.getElementById('model-status');
  const toast        = document.getElementById('toast');
  const diagramBtn   = document.getElementById('diagram-btn');
  const diagramWrap  = document.getElementById('diagram-wrap');
  const diagramTitle = document.getElementById('diagram-title');
  const diagramScope = document.getElementById('diagram-scope');
  const diagramSource = document.getElementById('diagram-source');
  const diagramPreview = document.getElementById('diagram-preview');
  const diagramDownloadBtn = document.getElementById('diagram-download-btn');

  const defaultSpeakers = [{% for s in speakers %}"{{ s }}"{% if not loop.last %}, {% endif %}{% endfor %}];
  const edgeVoices = [{% for v in edge_voices %}"{{ v }}"{% if not loop.last %}, {% endif %}{% endfor %}];

  mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

  // ── Toast helper ─────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, isError = false) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'show' + (isError ? ' error' : '');
    toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
  }

  // ── Char count ────────────────────────────────────────────────────────────
  function updateCount() {
    const t = textInput.value;
    const chars = t.length;
    const words = t.trim() ? t.trim().split(/\s+/).length : 0;
    charCount.textContent = `${chars.toLocaleString()} characters · ${words.toLocaleString()} words`;
  }
  textInput.addEventListener('input', updateCount);

  // ── Drag & drop ───────────────────────────────────────────────────────────
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) uploadFile(fileInput.files[0]);
    fileInput.value = '';
  });

  async function uploadFile(file) {
    const fd = new FormData();
    fd.append('file', file);
    dropZone.querySelector('span').textContent = `Loading ${file.name}…`;
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      textInput.value = data.text;
      updateCount();
      showToast(`Loaded: ${file.name}`);
    } catch (err) {
      showToast(err.message, true);
    } finally {
      dropZone.querySelector('span').innerHTML =
        '📂 Drop a file here or <u>click to open</u> — .txt · .md · .docx · .pdf';
    }
  }

  // ── Quick actions ─────────────────────────────────────────────────────────
  document.getElementById('paste-btn').addEventListener('click', async () => {
    try {
      const t = await navigator.clipboard.readText();
      textInput.value += t;
      updateCount();
    } catch { showToast('Clipboard access denied', true); }
  });
  document.getElementById('clear-btn').addEventListener('click', () => {
    textInput.value = '';
    updateCount();
    hideAudio();
  });

  // ── Normalize preview ────────────────────────────────────────────────────
  const normalizeToggle = document.getElementById('normalize-toggle');
  document.getElementById('preview-btn').addEventListener('click', async () => {
    const text = textInput.value;
    if (!text.trim()) { showToast('Type some text first', true); return; }
    try {
      const res = await fetch('/api/normalize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          language: document.getElementById('lang-select').value,
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      textInput.value = data.text;
      updateCount();
      showToast('Text normalized — review before generating');
    } catch (err) {
      showToast(err.message || 'Normalize failed', true);
    }
  });

  // ── Model status polling ──────────────────────────────────────────────────
  const loadingScreen = document.getElementById('loading-screen');
  const loadingText   = document.getElementById('loading-text');
  const appRoot       = document.getElementById('app');

  function showLoadingScreen(msg) {
    if (msg) loadingText.textContent = msg;
    loadingScreen.style.display = '';
    loadingScreen.classList.remove('hidden');
    appRoot.classList.remove('ready');
  }

  function hideLoadingScreen() {
    appRoot.classList.add('ready');
    loadingScreen.classList.add('hidden');
    setTimeout(() => { loadingScreen.style.display = 'none'; }, 450);
  }

  function currentBackendLabel() {
    return backendSelect.options[backendSelect.selectedIndex].text;
  }

  function setHeaderStatus(status, message) {
    // status: 'idle' | 'loading' | 'ready' | 'error'
    modelDot.classList.remove('ready', 'error');
    if (status === 'ready') {
      modelDot.classList.add('ready');
      modelStatus.textContent = `Model ready (${currentBackendLabel()})`;
    } else if (status === 'error') {
      modelDot.classList.add('error');
      modelStatus.textContent = `Error: ${message || 'unknown'}`;
    } else if (status === 'loading') {
      modelStatus.textContent = `Loading ${currentBackendLabel()}…`;
    } else {
      modelStatus.textContent = 'Idle';
    }
  }

  // Cancels in-flight polls when backend/device changes
  let pollToken = 0;

  async function ensureLoaded() {
    // Tell the server to start loading the currently selected backend
    try {
      await fetch('/api/load', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          backend: backendSelect.value,
          device: deviceSelect.value,
        }),
      });
    } catch (e) {
      // network error — polling will retry status anyway
    }
  }

  async function pollModel(token) {
    if (token !== pollToken) return; // stale poll, abort
    try {
      const res = await fetch(`/api/status?backend=${encodeURIComponent(backendSelect.value)}&device=${encodeURIComponent(deviceSelect.value)}`);
      const data = await res.json();
      if (token !== pollToken) return;

      if (data.model_ready || data.status === 'ready') {
        setHeaderStatus('ready');
        genBtn.disabled = false;
        hideLoadingScreen();
      } else if (data.status === 'error') {
        setHeaderStatus('error', data.message);
        genBtn.disabled = true;
        // Show error in the loading screen overlay
        loadingText.textContent = `Falha ao carregar ${currentBackendLabel()}`;
        const sub = document.getElementById('loading-sub');
        if (sub) sub.textContent = data.message || 'Erro desconhecido';
        // Hide spinner on error
        const spinner = document.querySelector('#loading-screen .spinner');
        if (spinner) spinner.style.display = 'none';
        showToast(`Erro ao carregar ${currentBackendLabel()}: ${data.message}`, true);
      } else {
        // loading or idle
        setHeaderStatus('loading');
        showLoadingScreen(`Carregando ${currentBackendLabel()}…`);
        const spinner = document.querySelector('#loading-screen .spinner');
        if (spinner) spinner.style.display = '';
        const sub = document.getElementById('loading-sub');
        if (sub) sub.textContent = 'Isso pode levar alguns minutos no primeiro uso enquanto o modelo é baixado.';
        setTimeout(() => pollModel(token), 1500);
      }
    } catch {
      setTimeout(() => pollModel(token), 3000);
    }
  }

  function startPollingForCurrentBackend() {
    pollToken += 1;
    const myToken = pollToken;
    setHeaderStatus('loading');
    showLoadingScreen(`Carregando ${currentBackendLabel()}…`);
    genBtn.disabled = true;
    ensureLoaded().finally(() => pollModel(myToken));
  }

  // Initial boot
  loadingText.textContent = `Carregando ${currentBackendLabel()}…`;
  startPollingForCurrentBackend();

  backendSelect.addEventListener('change', () => {
    updateSpeakerChoices();
    startPollingForCurrentBackend();
  });
  deviceSelect.addEventListener('change', () => {
    startPollingForCurrentBackend();
  });

  function fillSelect(selectEl, values, preferred) {
    const previous = selectEl.value;
    selectEl.innerHTML = '';
    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      selectEl.appendChild(opt);
    });
    if (values.includes(previous)) {
      selectEl.value = previous;
    } else if (preferred && values.includes(preferred)) {
      selectEl.value = preferred;
    } else if (values.length > 0) {
      selectEl.value = values[0];
    }
  }

  function updateSpeakerChoices() {
    if (backendSelect.value === 'edge') {
      fillSelect(speakerSelect, edgeVoices, 'pt-BR-AntonioNeural');
    } else {
      fillSelect(speakerSelect, defaultSpeakers, 'Ryan');
    }
  }

  updateSpeakerChoices();

  // ── Generate ──────────────────────────────────────────────────────────────
  genBtn.addEventListener('click', startGenerate);

  async function startGenerate() {
    const text = textInput.value.trim();
    if (!text) { showToast('Enter some text first', true); return; }

    genBtn.disabled = true;
    hideAudio();
    showProgress('Starting…', 0);

    const body = {
      text,
      backend: backendSelect.value,
      device: deviceSelect.value,
      speaker: document.getElementById('speaker-select').value,
      language: document.getElementById('lang-select').value,
      normalize_text: normalizeToggle.checked,
    };

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      currentTaskId = data.task_id;
      pollTask();
    } catch (err) {
      showToast(err.message, true);
      hideProgress();
      genBtn.disabled = false;
    }
  }

  function pollTask() {
    pollTimer = setTimeout(async () => {
      try {
        const res = await fetch(`/api/task/${currentTaskId}`);
        const task = await res.json();

        if (task.status === 'processing') {
          showProgress(task.message, task.progress);
          pollTask();
        } else if (task.status === 'done') {
          showProgress('Done.', 100);
          setTimeout(() => {
            hideProgress();
            showAudio(`/api/audio/${currentTaskId}`);
            genBtn.disabled = false;
          }, 600);
        } else {
          showToast(task.message || 'Generation failed', true);
          hideProgress();
          genBtn.disabled = false;
        }
      } catch {
        pollTask(); // retry on network error
      }
    }, 1000);
  }

  // ── Progress helpers ──────────────────────────────────────────────────────
  function showProgress(msg, pct) {
    progressWrap.classList.add('visible');
    progressMsg.textContent = msg;
    progressBar.value = pct;
  }
  function hideProgress() { progressWrap.classList.remove('visible'); }

  // ── Audio helpers ─────────────────────────────────────────────────────────
  function showAudio(url) {
    if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
    audioPlayer.src = url;
    audioPlayer.load();
    audioWrap.classList.add('visible');
    downloadBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = url;
      a.download = 'speech.wav';
      a.click();
    };
    showToast('Audio ready!');
  }
  function hideAudio() { audioWrap.classList.remove('visible'); audioPlayer.src = ''; }

  // ── Mermaid diagram ──────────────────────────────────────────────────────
  function selectedTextFromEditor() {
    const start = textInput.selectionStart || 0;
    const end = textInput.selectionEnd || 0;
    if (end > start) {
      return textInput.value.slice(start, end).trim();
    }
    return '';
  }

  async function generateDiagram() {
    const text = textInput.value.trim();
    if (!text) {
      showToast('Enter some text first', true);
      return;
    }

    diagramBtn.disabled = true;
    try {
      const res = await fetch('/api/diagram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          selected_text: selectedTextFromEditor(),
          scope: diagramScope.value,
          title: diagramTitle.value || 'Text Flow',
          max_nodes: 12,
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      currentMermaid = data.mermaid || '';
      diagramSource.textContent = currentMermaid;

      const renderId = 'm' + Date.now();
      const rendered = await mermaid.render(renderId, currentMermaid);
      diagramPreview.innerHTML = rendered.svg;

      diagramWrap.classList.add('visible');
      showToast('Diagram generated');
    } catch (err) {
      showToast(err.message || 'Diagram error', true);
    } finally {
      diagramBtn.disabled = false;
    }
  }

  function downloadMermaid() {
    if (!currentMermaid) {
      showToast('Generate a diagram first', true);
      return;
    }
    const blob = new Blob([currentMermaid], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'diagram.mmd';
    a.click();
    URL.revokeObjectURL(url);
  }

  diagramBtn.addEventListener('click', generateDiagram);
  diagramDownloadBtn.addEventListener('click', downloadMermaid);
</script>
</body>
</html>
